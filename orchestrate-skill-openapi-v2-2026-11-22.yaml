openapi: "3.0.3"
info:
  title: "AWDC Query Studio - Orchestrate Skill"
  description: >
    Single-operation skill for IBM watsonx Orchestrate. Submits a
    natural-language question to the Query Studio chat engine and
    receives the assistant's answer, including the generated SQL.
  version: "1.0.0"

servers:
  - url: "https://chat.california.vision"

security:
  - ServiceKey: []

paths:
  /api/agent/query:
    post:
      operationId: "agentQuery"
      summary: "Submit a natural-language question to Query Studio"
      description: >
        Accepts a plain-English question, runs it through the LLM and SQL
        pipeline, and returns the assistant's answer together with the SQL
        that was executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            example:
              message: "How many animals were taken in each month of 2024?"
      responses:
        "200":
          description: "Successful answer from the query engine"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "401":
          description: "Missing or invalid X-Service-Key header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ServiceKey:
      type: "apiKey"
      in: "header"
      name: "X-Service-Key"
      description: "Static service key issued to IBM watsonx Orchestrate."

  schemas:
    QueryRequest:
      type: "object"
      required:
        - message
      properties:
        message:
          type: "string"
          description: "Natural-language question to send to the query engine."
          example: "How many animals were taken in each month of 2024?"

    QueryResponse:
      type: "object"
      required:
        - response
        - session_id
        - message_count
        - tool_calls_count
        - queries
      properties:
        response:
          type: "string"
          description: "The assistant's answer in plain text or Markdown."
        timestamp:
          type: "string"
          description: "ISO-8601 timestamp of the assistant message."
        session_id:
          type: "string"
          description: "Server-side session identifier for this call."
        message_count:
          type: "integer"
          description: "Total messages in the session after this exchange."
        tool_calls_count:
          type: "integer"
          description: "Number of SQL tool calls made during this response."
        queries:
          type: "array"
          description: "SQL statements executed to produce the answer."
          items:
            type: "string"

    ErrorResponse:
      type: "object"
      required:
        - error
        - message
        - code
      properties:
        error:
          type: "boolean"
          example: true
        message:
          type: "string"
          description: "Human-readable description of the error."
        code:
          type: "string"
          description: "Machine-readable error code."
