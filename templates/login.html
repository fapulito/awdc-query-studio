<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ metadata.app_name }}</title>
    <meta name="description" content="Sign in to {{ metadata.app_name }} - {{ metadata.app_description }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ metadata.favicon_svg }}">
    <link rel="icon" type="image/x-icon" href="{{ metadata.favicon_ico }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ metadata.favicon_16 }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ metadata.favicon_32 }}">
    <link rel="apple-touch-icon" href="{{ metadata.apple_touch_icon }}">
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="{{ metadata.theme_color }}">
    <meta name="msapplication-TileColor" content="{{ metadata.theme_color }}">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Login - {{ metadata.app_name }}">
    <meta property="og:description" content="{{ metadata.app_description }}">
    <meta property="og:image" content="{{ metadata.og_image }}">
    <meta property="og:image:width" content="{{ metadata.og_image_width }}">
    <meta property="og:image:height" content="{{ metadata.og_image_height }}">
    <meta property="og:url" content="{{ metadata.app_url }}">
    <meta property="og:type" content="{{ metadata.og_type }}">
    <meta property="og:site_name" content="{{ metadata.app_name }}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="{{ metadata.twitter_card_type }}">
    {% if metadata.twitter_site %}
    <meta name="twitter:site" content="{{ metadata.twitter_site }}">
    {% endif %}
    {% if metadata.twitter_creator %}
    <meta name="twitter:creator" content="{{ metadata.twitter_creator }}">
    {% endif %}
    <meta name="twitter:title" content="Login - {{ metadata.app_name }}">
    <meta name="twitter:description" content="{{ metadata.app_description }}">
    <meta name="twitter:image" content="{{ metadata.twitter_image }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Login page specific styles */
        .login-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .provider-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .provider-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .provider-button:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .provider-button:active {
            transform: translateY(0);
        }

        .provider-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Provider specific colors */
        .provider-button.google:hover {
            border-color: #4285f4;
            background: #f1f5ff;
        }

        .provider-button.github:hover {
            border-color: #333;
            background: #f5f5f5;
        }

        .provider-button.facebook:hover {
            border-color: #1877f2;
            background: #f0f5ff;
        }

        .provider-button.linkedin:hover {
            border-color: #0077b5;
            background: #f0f7ff;
        }

        .provider-button.auth0:hover {
            border-color: #eb5424;
            background: #fff5f2;
        }

        /* Error message styling */
        .error-message {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .login-container {
                max-width: 100%;
                padding: 30px 20px;
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .provider-button {
                padding: 16px 20px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 20px 15px;
            }

            .login-header h1 {
                font-size: 22px;
            }

            .provider-button {
                font-size: 15px;
            }
        }

        /* Loading state */
        .provider-button.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .provider-button.loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome to {{ metadata.app_name }}</h1>
            <p>Sign in to continue</p>
        </div>

        <!-- Error message display -->
        <div class="error-message" id="error-message">
            <!-- Error text will be inserted here -->
        </div>

        <!-- Provider selection buttons -->
        <div class="provider-buttons">
            <a href="{{ url_for('auth_redirect', provider='google') }}" class="provider-button google">
                <span class="provider-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </span>
                Continue with Google
            </a>

            <a href="{{ url_for('auth_redirect', provider='github') }}" class="provider-button github">
                <span class="provider-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                    </svg>
                </span>
                Continue with GitHub
            </a>

            <a href="{{ url_for('auth_redirect', provider='facebook') }}" class="provider-button facebook">
                <span class="provider-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877f2" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </span>
                Continue with Facebook
            </a>

            <a href="{{ url_for('auth_redirect', provider='linkedin') }}" class="provider-button linkedin">
                <span class="provider-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#0077b5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </span>
                Continue with LinkedIn
            </a>

            <a href="{{ url_for('auth_redirect', provider='auth0') }}" class="provider-button auth0">
                <span class="provider-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#eb5424" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21.98 7.448L19.62 0H4.347L2.02 7.448c-1.352 4.312.03 9.206 3.815 12.015L12.007 24l6.157-4.537c3.785-2.808 5.167-7.703 3.815-12.015zm-6.804 10.376l-3.17 2.332-3.169-2.332c-2.545-1.882-3.471-5.177-2.562-8.08l1.563-5.003h9.337l1.563 5.003c.909 2.903-.017 6.198-2.562 8.08z"/>
                    </svg>
                </span>
                Continue with Auth0
            </a>
        </div>
    </div>

    <script>
        // Display error message if present in URL
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error) {
                const errorMessage = document.getElementById('error-message');
                const errorMessages = {
                    'invalid_state': 'Authentication failed: Invalid state parameter. Please try again.',
                    'access_denied': 'Authentication was cancelled or denied.',
                    'provider_error': 'Authentication provider error. Please try again.',
                    'missing_code': 'Authentication failed: Missing authorization code.',
                    'token_exchange_failed': 'Failed to exchange authorization code. Please try again.',
                    'user_info_failed': 'Failed to retrieve user information. Please try again.',
                    'configuration_error': 'OAuth2 configuration error. Please contact support.',
                    'unknown_provider': 'Unknown authentication provider.',
                    'default': 'Authentication failed. Please try again.'
                };
                
                errorMessage.textContent = errorMessages[error] || errorMessages['default'];
                errorMessage.classList.add('show');
            }

            // Add loading state to buttons on click
            const providerButtons = document.querySelectorAll('.provider-button');
            providerButtons.forEach(button => {
                button.addEventListener('click', function() {
                    this.classList.add('loading');
                });
            });
        });
    </script>
</body>
</html>
