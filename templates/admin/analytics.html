<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - {{ metadata.APP_NAME }}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ metadata.FAVICON_ICO }}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        
        .header .actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            color: #333;
            font-size: 36px;
            font-weight: bold;
        }
        
        .stat-card .subtitle {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .chart-container h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bar-label {
            min-width: 80px;
            color: #666;
            font-size: 14px;
        }
        
        .bar-wrapper {
            flex: 1;
            background: #f0f0f0;
            border-radius: 5px;
            height: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .bar-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }
        
        .bar-value {
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .provider-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .provider-badge {
            background: #f0f0f0;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .provider-badge strong {
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .date-range {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Analytics Dashboard</h1>
            <div class="actions">
                <button class="btn btn-primary" onclick="refreshData()">Refresh</button>
                <a href="/" class="btn btn-secondary">Back to Chat</a>
            </div>
        </div>
        
        <div id="loading" class="loading">Loading analytics...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="content" style="display: none;">
            <div class="date-range" id="dateRange"></div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value" id="totalUsers">-</div>
                    <div class="subtitle">Unique users</div>
                </div>
                
                <div class="stat-card">
                    <h3>Active Today</h3>
                    <div class="value" id="activeToday">-</div>
                    <div class="subtitle">Users active today</div>
                </div>
                
                <div class="stat-card">
                    <h3>Total Messages</h3>
                    <div class="value" id="totalMessages">-</div>
                    <div class="subtitle">Messages sent</div>
                </div>
                
                <div class="stat-card">
                    <h3>Avg Session</h3>
                    <div class="value" id="avgSession">-</div>
                    <div class="subtitle">Duration in minutes</div>
                </div>
            </div>
            
            <div class="chart-container">
                <h2>Peak Usage Hours</h2>
                <div class="bar-chart" id="peakHours"></div>
            </div>
            
            <div class="chart-container">
                <h2>Authentication Providers</h2>
                <div class="provider-list" id="providers"></div>
            </div>
        </div>
    </div>
    
    <script>
        let statsData = null;
        
        async function loadAnalytics() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                document.getElementById('content').style.display = 'none';
                
                const response = await fetch('/api/analytics');
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.message || 'Failed to load analytics');
                }
                
                statsData = data.stats;
                renderAnalytics(statsData);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading analytics:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        function renderAnalytics(stats) {
            // Update stat cards
            document.getElementById('totalUsers').textContent = stats.total_users || 0;
            document.getElementById('activeToday').textContent = stats.active_users_today || 0;
            document.getElementById('totalMessages').textContent = stats.total_messages || 0;
            
            // Convert session duration to minutes
            const avgMinutes = Math.round((stats.avg_session_duration || 0) / 60);
            document.getElementById('avgSession').textContent = avgMinutes;
            
            // Update date range
            if (stats.date_range) {
                const start = stats.date_range.start ? new Date(stats.date_range.start).toLocaleDateString() : 'Beginning';
                const end = stats.date_range.end ? new Date(stats.date_range.end).toLocaleDateString() : 'Now';
                document.getElementById('dateRange').textContent = `Data range: ${start} - ${end}`;
            }
            
            // Render peak hours chart
            renderPeakHours(stats.peak_usage_hours || {});
            
            // Render providers
            renderProviders(stats.provider_breakdown || {});
        }
        
        function renderPeakHours(peakHours) {
            const container = document.getElementById('peakHours');
            container.innerHTML = '';
            
            if (Object.keys(peakHours).length === 0) {
                container.innerHTML = '<p style="color: #999;">No data available</p>';
                return;
            }
            
            // Find max value for scaling
            const maxValue = Math.max(...Object.values(peakHours));
            
            // Sort by hour
            const sortedHours = Object.entries(peakHours).sort((a, b) => a[0].localeCompare(b[0]));
            
            sortedHours.forEach(([hour, count]) => {
                const percentage = (count / maxValue) * 100;
                
                const barItem = document.createElement('div');
                barItem.className = 'bar-item';
                barItem.innerHTML = `
                    <div class="bar-label">${hour}</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill" style="width: ${percentage}%">
                            <span class="bar-value">${count}</span>
                        </div>
                    </div>
                `;
                container.appendChild(barItem);
            });
        }
        
        function renderProviders(providers) {
            const container = document.getElementById('providers');
            container.innerHTML = '';
            
            if (Object.keys(providers).length === 0) {
                container.innerHTML = '<p style="color: #999;">No data available</p>';
                return;
            }
            
            Object.entries(providers).forEach(([provider, count]) => {
                const badge = document.createElement('div');
                badge.className = 'provider-badge';
                badge.innerHTML = `<strong>${provider}</strong>: ${count} login${count !== 1 ? 's' : ''}`;
                container.appendChild(badge);
            });
        }
        
        function refreshData() {
            loadAnalytics();
        }
        
        // Load analytics on page load
        loadAnalytics();
        
        // Auto-refresh every 60 seconds
        setInterval(loadAnalytics, 60000);
    </script>
</body>
</html>
