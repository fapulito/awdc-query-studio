openapi: "3.0.3"
info:
  title: "AWDC Query Studio — Orchestrate Skill"
  description: >
    Single-operation skill for IBM watsonx Orchestrate. Submits a natural-language
    question to the Query Studio chat engine and receives a structured answer,
    including the generated SQL queries and optional tabular result rows.
  version: "1.0.0"

servers:
  - url: "https://chat.california.vision"

security:
  - ServiceKey: []

paths:
  /api/agent/query:
    post:
      operationId: "agentQuery"
      summary: "Submit a natural-language question to Query Studio"
      description: >
        Accepts a plain-English question, runs it through the LLM + SQL pipeline,
        and returns the assistant's answer together with the SQL that was executed
        and (optionally) up to 200 result rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              monthly_counts:
                summary: "Monthly intake counts"
                value:
                  message: "How many animals were taken in each month of 2024?"
              animal_types:
                summary: "Animal type breakdown"
                value:
                  message: "Show me the count of each animal type, no shelter filter."
      responses:
        "200":
          description: "Successful answer from the query engine"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: "Bad request — missing or empty message field"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid X-Service-Key header"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: true
                message: "Authentication required"
                code: "UNAUTHORIZED"
        "503":
          description: >
            Service route is disabled (ORCHESTRATE_SERVICE_KEY is not configured
            on the server). Contact the platform team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: true
                message: "Service route is disabled"
                code: "SERVICE_DISABLED"

components:
  securitySchemes:
    ServiceKey:
      type: "apiKey"
      in: "header"
      name: "X-Service-Key"
      description: >
        Static service key issued to IBM watsonx Orchestrate.
        Set as the ORCHESTRATE_SERVICE_KEY environment variable on the server.

  schemas:
    QueryRequest:
      type: "object"
      required:
        - message
      properties:
        message:
          type: "string"
          minLength: 1
          description: "Natural-language question to send to the query engine."
          example: "How many animals were taken in each month of 2024?"

    QueryResponse:
      type: "object"
      required:
        - response
        - session_id
        - message_count
        - tool_calls_count
        - queries
      properties:
        response:
          type: "string"
          description: "The assistant's answer in plain text or Markdown."
        timestamp:
          type: "string"
          description: "ISO-8601 timestamp of the assistant message."
        session_id:
          type: "string"
          description: "Server-side session identifier for this call."
        message_count:
          type: "integer"
          description: "Total messages in the session after this exchange."
        tool_calls_count:
          type: "integer"
          description: "Number of SQL tool calls made during this response."
        queries:
          type: "array"
          description: "SQL statements executed to produce the answer."
          items:
            type: "string"
        result:
          description: >
            Tabular result of the last SQL query, if available.
            Null when no query produced row-level results.
          oneOf:
            - $ref: "#/components/schemas/TabularResult"
            - type: "null"

    TabularResult:
      type: "object"
      required:
        - table
        - columns
        - rows
      properties:
        table:
          type: "string"
          description: "Source table name."
        columns:
          type: "array"
          items:
            type: "string"
          description: "Column names in the order they appear in rows."
        rows:
          type: "array"
          description: "Up to 200 data rows, each an array of scalar values."
          items:
            type: "array"
            items: {}

    ErrorResponse:
      type: "object"
      required:
        - error
        - message
        - code
      properties:
        error:
          type: "boolean"
          example: true
        message:
          type: "string"
          description: "Human-readable description of the error."
        code:
          type: "string"
          description: "Machine-readable error code."
          enum:
            - "UNAUTHORIZED"
            - "SERVICE_DISABLED"
            - "INVALID_REQUEST"
            - "EMPTY_MESSAGE"
